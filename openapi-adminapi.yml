openapi: 3.1.0
info:
  title: MobileCMS Admin API
  description: Administrative operations for content management and theme configuration.
  version: v50
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
tags:
  - name: Admin
    description: Administrative operations
paths:
  /mobilecmsapi/v50/adminapi/theme:
    get:
      tags:
        - Admin
      operationId: getTheme
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: object
    post:
      tags:
        - Admin
      operationId: postTheme
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JsonNode'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: object
  /mobilecmsapi/v50/adminapi/theme/banner:
    post:
      tags:
        - Admin
      operationId: banner
      security:
        - bearerAuth: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                uploadfiles:
                  type: array
                  items:
                    type: string
                    format: binary
                banner:
                  type: string
                  format: binary
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: object

openapi: 3.1.0
info:
  title: MobileCMS File API
  description: File upload, delete, and thumbnail operations.
  version: v50
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
tags:
  - name: Files
    description: File upload and media endpoints
paths:
  /mobilecmsapi/v50/fileapi/thumbnails/{type}/{id}:
    post:
      tags:
        - Files
      operationId: thumbnails
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArrayNode'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: object
  /mobilecmsapi/v50/fileapi/delete/{type}/{id}:
    post:
      tags:
        - Files
      operationId: delete
      security:
        - bearerAuth: []
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArrayNode'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: object
  /mobilecmsapi/v50/fileapi/basicupload/{type}/{id}:
    get:
      tags:
        - Files
      operationId: list
      security:
        - bearerAuth: []
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: object
    post:
      tags:
        - Files
      operationId: upload
      security:
        - bearerAuth: []
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                uploadfiles:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: object
components:
  schemas:
    ArrayNode: {}
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

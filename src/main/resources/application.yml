server:
  port: 8888
  servlet:
    context-path: /

spring:
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  jackson:
    serialization:
      indent-output: false
      write-dates-as-timestamps: false

mobilecms:
  root-dir: ${MOBILECMS_ROOT:webhost}
  conf-file: ${MOBILECMS_CONF:webhost/private/conf/conf.json}
  api-root: /mobilecmsapi
  api-version: /v50
